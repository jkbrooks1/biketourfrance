# Approved copy check: NOT ACTIVE. It runs only when started by hand (workflow_dispatch).
#
# It runs the production-only command `npm run predeploy:approved-copy`, which reads the Google Sheet
# BTF_Approved_Site_Copy with the existing service account btf-sheets-access@btf-general.iam.gserviceaccount.com
# and fails unless the built site matches the approved copy. Without the two secrets below it fails, which is
# the intended behavior.
#
# To ACTIVATE (only after the owner approves; see docs/APPROVED_COPY_GATE.md, section 5):
#   1. Add the secrets BTF_COPY_GOOGLE_SA_JSON and BTF_COPY_SHEET_ID in the GitHub repository settings.
#   2. Add these triggers under "on:":
#        pull_request:
#          branches: [main]
#        push:
#          branches: [main]
#   3. Make the check "Approved copy check" required by branch protection on main.
# The normal Cloudflare Pages build command stays `npm run build` and does not use this workflow.
name: Approved copy check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-copy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approved-copy-check:
    name: Approved copy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production check (Sheet sync, validation, build, rendered-page verification)
        env:
          # GitHub Actions secrets. Never printed, never written to the repository.
          BTF_COPY_SHEET_ID: ${{ secrets.BTF_COPY_SHEET_ID }}
          BTF_COPY_GOOGLE_SA_JSON: ${{ secrets.BTF_COPY_GOOGLE_SA_JSON }}
        run: npm run predeploy:approved-copy

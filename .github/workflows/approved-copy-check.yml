# Approved copy check: active since 2026-10-05. Reads BTF_Approved_Site_Copy and checks
# rendered pages on every push and pull request to main, and on manual dispatch.
# Both GitHub secrets are configured. This workflow validates; Cloudflare Pages separately
# runs `npx astro build` from the committed src/data/approved-copy.ts and deploys through
# its Git integration. Requiring this check through branch protection remains an open decision.
# A push made by scheduled-copy-sync.yml with GITHUB_TOKEN does not trigger this workflow;
# that job runs the same predeploy pipeline before it commits.
name: Approved copy check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: approved-copy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approved-copy-check:
    name: Approved copy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production check (Sheet sync, validation, build, rendered-page verification)
        env:
          # GitHub Actions secrets. Never printed, never written to the repository.
          BTF_COPY_SHEET_ID: ${{ secrets.BTF_COPY_SHEET_ID }}
          BTF_COPY_GOOGLE_SA_JSON: ${{ secrets.BTF_COPY_GOOGLE_SA_JSON }}
        run: npm run predeploy:approved-copy
